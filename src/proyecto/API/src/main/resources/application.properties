spring.application.name=API
server.port=8081

# application.properties

spring.datasource.url=jdbc:mysql://localhost:3306/proyectofincurso
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.datasource.username=root
spring.datasource.password=cicadmin123!

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mostrar las consultas SQL por consola
spring.jpa.show-sql=true

# Generar las tablas automáticamente (create-drop | update | none)
spring.jpa.hibernate.ddl-auto=none

@SpringBootApplication(scanBasePackages = {"api"})


logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
logging.level.org.hibernate.event.internal=DEBUG
